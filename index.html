<!DOCTYPE html>
<html>
<head><title>Job Tracker</title></head>
<body>
  <h1>Job Tracker</h1>

  <form id="form">
    <input id="company" placeholder="Company" required>
    <input id="role" placeholder="Role" required>
    <input id="status" placeholder="Status" required>
    <input id="date_applied" type="date">
    <input id="referral" placeholder="Referral">
    <input id="link" placeholder="Link">
    <button type="submit">Add</button>
  </form>

  <table border="1">
    <thead>
      <tr><th>Company</th><th>Role</th><th>Status</th><th>Date</th><th>Referral</th><th>Link</th><th>Actions</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const STATUSES = ["applied", "OA", "interview", "offer", "rejected"];

    async function loadApps() {
      const res = await fetch("/applications");
      const apps = await res.json();
      const rows = document.getElementById("rows");
      rows.innerHTML = "";

      for (const a of apps) {
        const tr = document.createElement("tr");

        function addCell(text) {
          const td = document.createElement("td");
          td.textContent = text || "";
          tr.appendChild(td);
        }

        addCell(a.company);
        addCell(a.role);

        // status dropdown
        const statusTd = document.createElement("td");
        const select = document.createElement("select");
        const options = STATUSES.includes(a.status) ? STATUSES : [...STATUSES, a.status];
        for (const s of options) {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          if (s === a.status) opt.selected = true;
          select.appendChild(opt);
        }
        select.addEventListener("change", async () => {
          await fetch("/applications/" + a.id, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...a, status: select.value }),
          });
          loadApps();
        });
        statusTd.appendChild(select);
        tr.appendChild(statusTd);

        addCell(a.date_applied);
        addCell(a.referral);
        addCell(a.link);

        // delete button
        const actionTd = document.createElement("td");
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.addEventListener("click", async () => {
          if (!confirm("Delete " + a.company + "?")) return;
          await fetch("/applications/" + a.id, { method: "DELETE" });
          loadApps();
        });
        actionTd.appendChild(del);
        tr.appendChild(actionTd);

        rows.appendChild(tr);
      }
    }

    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = {};
      for (const id of ["company", "role", "status", "date_applied", "referral", "link"]) {
        body[id] = document.getElementById(id).value;
      }
      await fetch("/applications", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      event.target.reset();
      loadApps();
    });

    loadApps();
  </script>
</body>
</html>
